<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <svg class="bg-orbits" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter id="orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g transform="rotate(20 320 320)">
      <ellipse cx="320" cy="320" rx="280" ry="120" fill="none" stroke="#7C5CFC" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="600" cy="320" r="4.5" fill="#7C5CFC" filter="url(#orbit-glow)"/>
      <circle cx="40" cy="320" r="3" fill="#7C5CFC" opacity="0.7"/>
    </g>

    <g transform="rotate(-25 320 320)">
      <ellipse cx="320" cy="320" rx="280" ry="120" fill="none" stroke="#00D9C0" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="40" cy="320" r="4" fill="#00D9C0" filter="url(#orbit-glow)"/>
      <circle cx="600" cy="320" r="3" fill="#00D9C0" opacity="0.7"/>
    </g>

    <ellipse cx="320" cy="320" rx="200" ry="200" fill="none" stroke="#7C5CFC" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="320" cy="320" r="6" fill="#00D9C0" filter="url(#orbit-glow)"/>
  </svg>
  {% include nav.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    const orbits = document.querySelector('.bg-orbits');
    if (orbits && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      window.addEventListener('scroll', () => {
        const y = window.scrollY;
        orbits.style.transform = `translateY(-50%) rotate(${y * 0.08}deg)`;
      }, { passive: true });
    }
  </script>
</body>
</html>
