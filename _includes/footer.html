<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-col">
      <p class="footer-title">{{ site.event.full_title }}</p>
      <p>{{ site.event.dates_display }} · {{ site.event.venue_city }}</p>
    </div>
    <div class="footer-col">
      <p>Organized on behalf of the <a href="https://www.grss-ieee.org/technical-committees/quantum-earth-science-and-technology-quest/" target="_blank" rel="noopener">IEEE GRSS QUEST Working Group</a></p>
      <p><a href="mailto:{{ site.event.contact_email }}">{{ site.event.contact_email }}</a></p>
    </div>
    <div class="footer-col logos">
      {% for s in site.sponsors %}
        <img src="{{ s.logo | relative_url }}" alt="{{ s.name }}" class="footer-logo">
      {% endfor %}
    </div>
  </div>
</footer>
