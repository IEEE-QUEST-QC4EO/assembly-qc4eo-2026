<header class="nav">
  <div class="nav-inner">
    <a href="#top" class="nav-brand">{{ site.event.acronym }}</a>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#topics">Topics</a>
      <a href="#agenda">Agenda</a>
      <a href="#speakers">Speakers</a>
      <a href="#committee">Committee</a>
      <a href="#venue">Venue</a>
    </nav>
    <a href="{{ site.event.registration_url }}" class="nav-cta" target="_blank" rel="noopener">Register</a>
  </div>
</header>

{% if site.sponsors.size > 0 %}
<div class="logo-strip">
  <div class="logo-track">
    {% for s in site.sponsors %}
      <a href="{{ s.url }}" target="_blank" rel="noopener" class="logo-item">
        <img src="{{ s.logo | relative_url }}" alt="{{ s.name }}" class="logo-strip-img">
        <span class="logo-name">{{ s.name }}</span>
      </a>
    {% endfor %}
    {% for s in site.sponsors %}
      <a href="{{ s.url }}" target="_blank" rel="noopener" class="logo-item" aria-hidden="true" tabindex="-1">
        <img src="{{ s.logo | relative_url }}" alt="" class="logo-strip-img">
        <span class="logo-name">{{ s.name }}</span>
      </a>
    {% endfor %}
  </div>
</div>
{% endif %}
